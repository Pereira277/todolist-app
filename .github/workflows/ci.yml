name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      # The build only needs these to be defined; CI never talks to AWS, so
      # placeholders keep it independent from repository variables
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_placeholder
      NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder
      NEXT_PUBLIC_API_URL: https://api.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      # Unit tests run the TypeScript sources, so only loading the bundles catches
      # module resolution errors such as CommonJS requires inside the ESM output
      - name: Load bundles
        run: |
          node --input-type=module -e "await import('./dist/me.mjs')"
          node --input-type=module -e "await import('./dist/lists.mjs')"
          node --input-type=module -e "await import('./dist/tasks.mjs')"
